<nav class="pagination" aria-label="Pagination">
    {% if pagination.prev_url %}
    <a rel="prev" href="{{ pagination.prev_url | safe }}">&larr; prev</a>
    {% endif %}
    {% for link in pagination.pages %}
    {% if link.n == pagination.current %}
    <span class="current" aria-current="page">{{ link.n }}</span>
    {% else %}
    <a href="{{ link.url | safe }}">{{ link.n }}</a>
    {% endif %}
    {% endfor %}
    {% if pagination.next_url %}
    <a rel="next" href="{{ pagination.next_url | safe }}">next &rarr;</a>
    {% endif %}
</nav>
