    <!-- L -->
    <rect x="98" y="132" width="56" height="248"/>
    <rect x="98" y="324" width="136" height="56"/>
  </g>

  <g fill="#ff2d6f">
    <!-- H -->
    <rect x="258" y="132" width="56" height="248"/>
    <rect x="358" y="132" width="56" height="248"/>
    <rect x="258" y="228" width="156" height="56"/>
