<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="LH favicon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#141419"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#2e2e38" stroke-width="4"/>

  <!-- Geometric centered LH monogram -->
